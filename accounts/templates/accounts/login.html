{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <h1>Log in to ArtVault</h1>

    {% if form.errors %}
        <p class="form-error">Your username or password is incorrect.</p>
    {% endif %}

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Log in</button>
    </form>

    <p>
        Don’t have an account?
        <a href="{% url 'signup' %}">Sign up here</a>
    </p>
</div>
{% endblock %}
