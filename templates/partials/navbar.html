<nav class="navbar">
    <div class="nav-left">
        <a href="{% url 'home' %}" class="logo">ArtVault</a>
    </div>

    <div class="nav-center">
        <form class="search-box" method="GET" action="{% url 'artwork_list' %}">
            <input type="text" name="q" value="{{ request.GET.q }}" placeholder="Search...">
            <button class="search-icon" type="submit" aria-label="Search">🔍</button>
        </form>

        <div class="nav-links">
            <a href="{% url 'see_all' %}">See all</a>
            <a href="{% url 'category_list' %}">Category</a>
            <a href="{% url 'faq' %}">How to?</a>
            <a href="#">Buy</a>
            <a href="{% url 'add_artwork' %}">Sell</a>
        </div>
    </div>
        <div class="nav-right">

            {% if user.is_authenticated %}

	                <a href="{% url 'profile' %}" class="profile-link">

                        <div class="nav-profile-wrap">
	                        {% if user.seller and user.seller.logo %}
	                            <img src="{{ user.seller.logo.url }}" class="nav-profile-image" alt="{{ user.seller.name }}">

	                        {% elif user.profile.profile_image %}
	                            <img src="{{ user.profile.profile_image.url }}" class="nav-profile-image">

	                        {% else %}
	                            <div class="nav-profile-placeholder">
	                                <div class="nav-head"></div>
	                                <div class="nav-body"></div>
	                            </div>
	                        {% endif %}

                            {% if accepted_bid_count %}
                                <span class="nav-notification-badge">{{ accepted_bid_count }}</span>
                            {% endif %}
                        </div>

	                    <span>My profile</span>

                </a>

            {% else %}
                <a href="{% url 'login' %}" class="login-btn">
                    Login
                </a>

            {% endif %}
        </div>
</nav>
