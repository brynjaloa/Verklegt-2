<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/front_page.css' %}?v=3">
    <link rel="stylesheet" href="{% static 'css/front_page.css' %}?v=4">
    <link rel="stylesheet" href="{% static 'css/categories.css' %}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ArtVault</title>
    {% block extra_css %}
    {% endblock %}
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">

    {% include "partials/navbar.html" %}

    <main style="flex: 1;">
        {% block content %}
        {% endblock %}
    </main>

    {% include "partials/footer.html" %}

    <script src="{% static 'js/main.js' %}?v=6"></script>
    {% block extra_js %}
    {% endblock %}
</body>
</html>
