{% extends 'base.html' %}

{% block content %}
<div style="padding: 20px;">
    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px;">
        <a href="/" style="width: 40px; height: 40px; border-radius: 50%; border: 1px solid #ccc; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 18px; color: black;">‹</a>
        <h1 style="background-color: #CE7675; color: white; padding: 8px 24px; border-radius: 24px; margin: 0; font-size: 24px;">Categories</h1>
    </div>
    <div class="categories-grid">
        {% for value, label in categories %}
        <a href="{% url 'artwork_list' %}?category={{ value }}" class="category-card">
            <span>{{ label }}</span>
        </a>
        {% endfor %}
    </div>
</div>
{% endblock %}
