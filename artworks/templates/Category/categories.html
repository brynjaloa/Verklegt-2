{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="categories-container">
    <div class="categories-header">
        <a class="categories-back-link" href="{{ previous_page_url }}" aria-label="Back to previous page">‹</a>
        <h1 class="categories-heading">Categories</h1>
    </div>

    <div class="categories-grid">
        {% for value, label, image_path in categories %}
        <a href="{% url 'artwork_list' %}?category={{ value }}" class="category-card">
            {% if image_path %}
                <img class="category-card-image" src="{% get_media_prefix %}{{ image_path }}" alt="{{ label }}">
            {% endif %}
            <span>{{ label }}</span>
        </a>
        {% endfor %}
    </div>
</div>
{% endblock %}
